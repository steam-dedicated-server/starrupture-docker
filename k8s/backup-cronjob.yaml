apiVersion: batch/v1
kind: CronJob
metadata:
  name: starrupture-backup
spec:
  schedule: "0 4 * * *"                  # 04:00 UTC daily
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1001
            fsGroup: 1001
          containers:
            - name: backup
              image: ghcr.io/steam-dedicated-server/starrupture-docker:latest
              imagePullPolicy: Always
              args: ["backup"]
              envFrom:
                - secretRef:
                    name: starrupture-config
              volumeMounts:
                - name: data
                  mountPath: /mnt/steam
              resources:
                requests: { cpu: "200m", memory: "128Mi" }
                limits:   { cpu: "1",    memory: "512Mi" }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: starrupture-data
