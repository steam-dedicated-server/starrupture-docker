# Copy to `secret.yaml`, fill in values. See k8s/README.md for the
# full deployment flow (namespace creation + apply order).
apiVersion: v1
kind: Secret
metadata:
  name: starrupture-config
  namespace: starrupture
type: Opaque
stringData:
  # --- IDENTITY ---
  SERVER_NAME:        "starrupture-01"
  SERVER_PORT:        "7777"
  SERVER_QUERY_PORT:  "27015"

  # --- SESSION ---
  USE_DSSETTINGS:     "true"
  SESSION_NAME:       "StarRuptureServer"
  SAVE_GAME_INTERVAL: "300"
  START_NEW_GAME:     "false"
  LOAD_SAVED_GAME:    "true"
  SAVE_GAME_NAME:     "AutoSave0.sav"

  # --- STEAM ---
  STEAM_USER:         "anonymous"
